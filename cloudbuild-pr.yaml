# PR check (trigger website-florizeflowers-pr, runs as ci-pr@): the build part of cloudbuild.yaml —
# install, Studio build, site build — without cancelling builds, the Studio deploy, the bucket
# upload and the cache headers. No Sanity read token (ci-pr@ reads only ci-github-token): the
# production dataset is public and the site's Sanity client takes the token as optional.
steps:
  - id: install-dependencies
    name: "node:20"
    entrypoint: npm
    args: ["install"]
  - id: build-studio
    name: "node:20"
    entrypoint: bash
    args: ["-c", "cd studio && npm install && npm run build"]
    waitFor: ["install-dependencies"]
  - id: build-site
    name: "node:20"
    entrypoint: npm
    args: ["run", "build"]
    waitFor: ["install-dependencies"]
    env:
      - "PUBLIC_SANITY_PROJECT_ID=${_SANITY_PROJECT_ID}"
      - "PUBLIC_SANITY_DATASET=${_SANITY_DATASET}"
      - "SANITY_PROJECT_ID=${_SANITY_PROJECT_ID}"
      - "SANITY_DATASET=${_SANITY_DATASET}"
substitutions:
  _SANITY_PROJECT_ID: "vm53xzke"
  _SANITY_DATASET: "production"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: "900s"
